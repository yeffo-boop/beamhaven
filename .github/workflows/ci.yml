name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beamhaven
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: beamhaven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beamhaven -d beamhaven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      # Throwaway database that only exists for this CI run.
      DATABASE_URL: postgresql://beamhaven:ci-only-password@localhost:5432/beamhaven_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (laptop, iPad and phone sizes)
        run: npm run test:e2e

  docker:
    # Builds both production images, starts the server stack and checks the
    # website answers, so a broken Dockerfile or Compose file fails here
    # rather than on the VM.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a throwaway stack
        run: |
          cat > .env <<ENV
          APP_URL=http://localhost:3000
          APP_BIND_IP=127.0.0.1
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          TRUST_PROXY=true
          ENV
          # Made by us (as on the VM), so Docker doesn't create it as root.
          mkdir -p backups/status
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Health check
        run: curl --fail --silent http://127.0.0.1:3000/api/health
      - name: The worker starts and runs its first reminders pass
        run: timeout 90 sh -c 'until docker compose logs worker | grep -q "reminder(s)"; do sleep 3; done'
      - name: Backups (local, off-site to a folder, status, and reading one back)
        run: |
          printf 'RESTIC_REPOSITORY=/tmp/beamhaven-offsite\nRESTIC_PASSWORD=%s\n' "$(openssl rand -hex 16)" >> .env
          ./scripts/server/backup.sh
          ./scripts/server/backup.sh
          ./scripts/server/backup.sh
          # Locally, one per day is kept. Off-site, restic also keeps the oldest
          # until it has a full 7 days, so 3 runs today leave 2: pruning works.
          test "$(ls backups/beamhaven-db-*.dump | wc -l)" = 1
          test "$(./scripts/server/offsite.sh snapshots --json | jq length)" = 2
          grep -q '"ok":true' backups/status/last-backup.json
          grep -q '"offsite":"ok"' backups/status/last-backup.json
          # The website can read the status (owners see a warning when it's bad).
          docker compose exec -T app cat /data/backup-status/last-backup.json | grep -q '"ok":true'
          # And the off-site copy comes back as a readable database dump.
          ./scripts/server/offsite.sh restore latest --target /backups/from-offsite
          dump="$(sudo find backups/from-offsite -name 'beamhaven-db-*.dump' | head -1)"
          sudo cat "$dump" | docker compose exec -T db pg_restore --list > /dev/null
      - name: The database port is not published
        # "docker compose port" prints ":0" for an unpublished port, so check the
        # container's actual port bindings instead: none means not reachable.
        run: test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q db)")" = "{}"
      - name: Logs (if something failed)
        if: failure()
        run: docker compose logs --tail 100
