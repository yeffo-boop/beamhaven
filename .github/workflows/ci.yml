name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beamhaven
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: beamhaven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beamhaven -d beamhaven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      # Throwaway database that only exists for this CI run.
      DATABASE_URL: postgresql://beamhaven:ci-only-password@localhost:5432/beamhaven_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
      - name: Production build
        run: npm run build
